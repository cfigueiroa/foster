name: Release

on:
  push:
    tags: ['v*']
  # Lets the whole pipeline be exercised without publishing anything.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the GitHub release (leave off to only build and verify)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The installer pins the release it downloads, and every copy foster writes
      # is stamped with its build version. A tag whose tree disagrees with either
      # would install the wrong bundle or mislabel its own output, so it never
      # reaches the release step.
      - name: Verify the version matches the tag
        run: node scripts/version.mjs check "${GITHUB_REF_NAME}"
        if: startsWith(github.ref, 'refs/tags/')

      - name: Verify the version is self-consistent
        run: node scripts/version.mjs check
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - run: npm run build

      # A bundle that cannot start is worse than no release: the output is a
      # single file assembled by the bundler, and packaging mistakes (a stray
      # shebang, an unshimmed require) only surface when it is actually executed.
      - name: Smoke-test the bundle
        run: |
          set -euo pipefail

          # The release ships and checksums exactly one file, so the build must
          # produce exactly one. A dynamic import is enough to make the bundler
          # split out a chunk, which would be left behind at publish time and
          # only fail once a user reached the code path that loads it.
          count="$(find dist -name '*.js' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "::error::build produced $count JS files, expected a single self-contained bundle:"
            find dist -name '*.js'
            exit 1
          fi

          expected="$(node -p "require('./package.json').version")"
          actual="$(node dist/foster.js --version)"
          [ "$actual" = "$expected" ] || { echo "::error::bundle reports $actual, expected $expected"; exit 1; }
          node dist/foster.js --help > /dev/null

          # Run it from a directory holding nothing but the bundle and the
          # package.json install.ps1 writes beside it, which is what an install
          # looks like: an unresolvable relative import fails here. The
          # directory sits under a package.json that declares no type — the
          # ordinary state of a Windows home directory, and what Node finds
          # instead when the install does not declare its own.
          root="$(mktemp -d)"
          echo '{ "name": "not-foster" }' > "$root/package.json"
          isolated="$root/install"
          mkdir "$isolated"
          cp dist/foster.js "$isolated/"
          echo '{ "type": "module" }' > "$isolated/package.json"

          # Nothing may reach stderr ahead of the output that was asked for. A
          # startup warning is not cosmetic here: it prefixes every command,
          # including the ones whose output gets piped somewhere.
          noise="$(cd "$isolated" && FOSTER_NO_UPDATE_CHECK=1 node foster.js --version 2>&1 >/dev/null)"
          if [ -n "$noise" ]; then
            echo "::error::the bundle wrote to stderr on startup:"
            echo "$noise"
            exit 1
          fi
          echo "bundle is self-contained, starts quietly, and reports $actual"

      - name: Generate checksum
        working-directory: dist
        run: sha256sum foster.js > foster.js.sha256

      - name: Write release notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cat > release-notes.md <<NOTES
          Bring Claude Desktop **Code** sessions from a previous local account back into the sidebar of the account you are signed into now — without moving or modifying the originals.

          ## Install

          \`\`\`powershell
          irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${tag}/install.ps1 | iex
          \`\`\`

          The installer downloads \`foster.js\` from this release and verifies its SHA256 against \`foster.js.sha256\` before installing anything. Requires Node.js 20 or newer.

          ## Safety

          - The originals are never modified; fostering only adds files to the current account's folder.
          - \`foster\`, \`restore\`, \`return\` and \`purge\` are dry runs unless you pass \`--yes\`.
          - Adding copies works while Claude Desktop is open. Removing them refuses for copies a running app has already loaded, since deleting one it holds in memory only makes it write the file back.
          - \`purge\` destroys conversations on disk and cannot be undone. It takes \`--confirm <count>\` as well as \`--yes\`, and only ever considers conversations whose session the app has already deleted and that nothing still points at.
          - Credential files, cookie stores and OAuth token caches are never read.

          Changes appear after you restart Claude Desktop — the sidebar is built at startup and does not watch the directory.

          **Cowork sessions are not supported:** their store is local like the Code one, so the mechanism probably transfers, but a Cowork session owns a sandbox state a copy does not carry and this has not been verified end to end. This is a Code-session tool.
          NOTES
        if: startsWith(github.ref, 'refs/tags/')

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # install.ps1 ships as an asset so that
          # /releases/latest/download/install.ps1 always serves the newest
          # installer. That URL is stable, which means anything pointing at it
          # never needs updating for a new release — and the integrity story is
          # unchanged, because the installer pins the tag it was published from
          # and verifies the bundle against that release's checksum.
          gh release create "${GITHUB_REF_NAME}" \
            dist/foster.js dist/foster.js.sha256 install.ps1 \
            --title "foster ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Report what a dry run produced
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.publish }}
        run: |
          echo "Dry run: everything verified, nothing published."
          ls -l dist/
          cat dist/foster.js.sha256
