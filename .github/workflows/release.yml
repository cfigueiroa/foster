name: Release

on:
  push:
    tags: ['v*']
  # Lets the whole pipeline be exercised without publishing anything.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the GitHub release (leave off to only build and verify)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The installer pins the release it downloads, and every copy foster writes
      # is stamped with its build version. A tag whose tree disagrees with either
      # would install the wrong bundle or mislabel its own output, so it never
      # reaches the release step.
      - name: Verify the version matches the tag
        run: node scripts/version.mjs check "${GITHUB_REF_NAME}"
        if: startsWith(github.ref, 'refs/tags/')

      - name: Verify the version is self-consistent
        run: node scripts/version.mjs check
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - run: npm run build

      # A bundle that cannot start is worse than no release: the output is a
      # single file assembled by the bundler, and packaging mistakes (a stray
      # shebang, an unshimmed require) only surface when it is actually executed.
      - name: Smoke-test the bundle
        run: |
          set -euo pipefail
          expected="$(node -p "require('./package.json').version")"
          actual="$(node dist/foster.js --version)"
          [ "$actual" = "$expected" ] || { echo "::error::bundle reports $actual, expected $expected"; exit 1; }
          node dist/foster.js --help > /dev/null
          echo "bundle runs and reports $actual"

      - name: Generate checksum
        working-directory: dist
        run: sha256sum foster.js > foster.js.sha256

      - name: Write release notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cat > release-notes.md <<NOTES
          Bring Claude Desktop **Code** sessions from a previous local account back into the sidebar of the account you are signed into now — without moving or modifying the originals.

          ## Install

          \`\`\`powershell
          irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${tag}/install.ps1 | iex
          \`\`\`

          The installer downloads \`foster.js\` from this release and verifies its SHA256 against \`foster.js.sha256\` before installing anything. Requires Node.js 20 or newer.

          ## Safety

          - The originals are never modified; fostering only adds files to the current account's folder.
          - \`foster\` and \`return\` are dry runs unless you pass \`--yes\`.
          - Both refuse to run while Claude Desktop is open, because the app rewrites session files at runtime.
          - Credential files, cookie stores and OAuth token caches are never read.

          Changes appear after you restart Claude Desktop — the sidebar is built at startup and does not watch the directory.

          **Cowork sessions cannot be fostered:** the list the app shows is built from the server, not from the local folder. This is a Code-session tool.
          NOTES
        if: startsWith(github.ref, 'refs/tags/')

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/foster.js dist/foster.js.sha256 \
            --title "foster ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Report what a dry run produced
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.publish }}
        run: |
          echo "Dry run: everything verified, nothing published."
          ls -l dist/
          cat dist/foster.js.sha256
