name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Node 20 reaches end-of-life April 2026 and is dropped from the
        # matrix rather than kept alongside these: vitest 5 (picked up to
        # clear three high-severity advisories, see npm audit history)
        # requires Node ^22.12.0 || ^24.0.0 || >=26.0.0 and refuses to start
        # under 20 at all. This is a devDependency requirement only — the
        # built CLI (dist/foster.js) has no such floor, which is why
        # package.json's own "engines" stays >=20.
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Catches a half-finished bump long before a tag makes it a release problem.
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Coverage, not a plain test run: vitest.config.ts sets a coverage floor
      # (see the comment there) and only --coverage actually collects and
      # enforces it. `npm test` alone would let coverage regress silently —
      # this is the gate, and `npm run check` (package.json) mirrors it so a
      # local run fails the same way CI would.
      - run: npm run coverage

  # Build + bundle smoke test used to run only in release.yml, on a tag push —
  # a packaging mistake in the single-file bundle was invisible until a release
  # was already being cut. Runs on every PR and push now, same script release.yml
  # uses, so the two cannot drift apart.
  #
  # Node 20 is kept alongside 24 here (unlike the `check` job above): this job
  # never runs vitest, so it carries none of vitest 5's Node floor, and
  # package.json's own "engines" (>=20) is a live promise about dist/foster.js
  # itself — the one thing this job actually executes. Dropping the matrix to
  # 24-only would verify the shipped bundle only on a newer Node than the CLI
  # claims to support.
  build-smoke:
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: scripts/smoke-bundle.sh

  # npm audit is scoped to production dependencies only: this CLI ships exactly
  # two runtime dependencies (commander, picocolors), and the dev toolchain
  # (vitest, tsup, eslint, the agent SDK, ...) carries advisories of its own
  # that never reach anything foster installs or executes on a user's machine.
  # `npm run check` still runs the unscoped `npm audit` for a human to read;
  # this is the gate that fails the build.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  # Guard: this repo is public. Real account identifiers and personal paths must never land in it.
  # The MSIX package prefix (Claude_*) is deliberately NOT vetoed: its suffix is a publisher hash,
  # identical on every machine, and the store resolver needs to match on it.
  #
  # scripts/privacy.mjs is the one implementation (issue #134): this job runs
  # it instead of carrying its own copy of the patterns, and the script itself
  # uses `git grep --untracked` so `npm run privacy` sees, before a push, what
  # this job would otherwise be the first to see after one.
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/privacy.mjs
