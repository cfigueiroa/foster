name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # Guard: this repo is public. Real account identifiers and personal paths must never land in it.
  # The MSIX package prefix (Claude_*) is deliberately NOT vetoed: its suffix is a publisher hash,
  # identical on every machine, and the store resolver needs to match on it.
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for personal data
        shell: bash
        run: |
          set -uo pipefail
          status=0

          # Windows user profile paths of the maintainer (any C:\Users\<name> literal is suspect).
          if git grep -nIE 'C:\\\\Users\\\\[A-Za-z0-9._-]+' -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::Found a literal C:\\Users\\<name> path. Use a placeholder or resolve at runtime."
            status=1
          fi

          # Bare UUIDs: account/organization/session identifiers must be synthetic and clearly fake.
          # Synthetic fixtures use the reserved 0000.../1111... style, which this pattern ignores.
          if git grep -nIE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' \
               -- . ':(exclude).github/workflows/ci.yml' \
             | grep -vE '(0{4,}|1{4,}|2{4,}|a{4,}|f{4,}|deadbeef|cafe)'; then
            echo "::error::Found a realistic UUID. Fixtures must use obviously synthetic identifiers."
            status=1
          fi

          exit $status
