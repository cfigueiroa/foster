name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Catches a half-finished bump long before a tag makes it a release problem.
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # Guard: this repo is public. Real account identifiers and personal paths must never land in it.
  # The MSIX package prefix (Claude_*) is deliberately NOT vetoed: its suffix is a publisher hash,
  # identical on every machine, and the store resolver needs to match on it.
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for personal data
        shell: bash
        run: |
          set -uo pipefail
          status=0
          scope=(-- . ':(exclude).github/workflows/ci.yml')

          # Windows user-profile paths, in both the single-backslash form used in
          # prose and the doubled form used inside string literals, plus the
          # forward-slash spelling.
          if git grep -nIiE 'C:[\\/]+Users[\\/]+[A-Za-z0-9._-]+' "${scope[@]}"; then
            echo "::error::Found a literal C:\\Users\\<name> path. Use a placeholder or resolve at runtime."
            status=1
          fi

          # Account/organization/session identifiers must be obviously synthetic.
          #
          # Each UUID is judged on its own: filtering whole lines would let a real
          # identifier through whenever a synthetic one shared the line, and the
          # match is case-insensitive so an uppercase UUID cannot slip past.
          # Exclusions are long runs of one hex digit, which no real UUID contains.
          uuid='[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}'
          if git grep -hoIiE "$uuid" "${scope[@]}" \
             | grep -viE '(0{4,}|1{4,}|2{4,}|a{4,}|f{4,}|deadbeef)' \
             | sort -u | grep .; then
            echo "::error::Found a realistic UUID. Fixtures must use obviously synthetic identifiers."
            echo "::error::Locations:"
            git grep -nIiE "$uuid" "${scope[@]}" || true
            status=1
          fi

          # Two personal identifiers that reached the repository once: a first
          # name and a mailbox prefix. Base64 so this workflow does not itself
          # publish what it guards; searched without -I because the fixture that
          # held them is binary to git, and a binary match still names its file.
          # On a hit, only file names are printed — these logs are public too.
          for encoded in am9yZ2Vyb2JlcnRv bGVpbGE=; do
            if git grep -liF -e "$(printf '%s' "$encoded" | base64 -d)" "${scope[@]}" | grep .; then
              echo "::error::A personal identifier (base64 $encoded) is in the files above."
              status=1
            fi
          done

          exit $status
